[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["_orchestration", "runs", "type5_protocol/results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM", "BLE001", "TRY004", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
# CLI entry points expose the repository root before importing sibling stages.
"**/generator.py" = ["E402"]
"run.py" = ["E402"]
"**/passk.py" = ["E402"]
"**/test_*.py" = ["E402"]
# Preserve archived experiment code hashes; these are style-only findings.
"type5_protocol/**" = ["E741", "B007", "C420", "SIM300"]
