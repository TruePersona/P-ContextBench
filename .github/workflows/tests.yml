name: Pipeline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Offline pipeline and protocol regression tests
        run: >-
          python -m unittest test_pipeline
          pipeline_integrity.test_integrity
          step4_app_log_synthesizer.test_decoys
          step4_app_log_synthesizer.test_decoy_safety
          step4_app_log_synthesizer.test_evidence_alignment
          step6_benchmark_runner.test_passk
          step6_benchmark_runner.test_t5_contract
          step6_benchmark_runner.test_t5_scoring
          type5_protocol.test_protocol type5_protocol.test_experiment
          type5_protocol.test_validation type5_protocol.test_policy_study -q
